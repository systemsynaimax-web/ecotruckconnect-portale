<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EcoTruckConnect — Ti portiamo alla cassa</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080d16;color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:24px;box-sizing:border-box;}
  .box{max-width:420px;}
  .spin{width:42px;height:42px;border:3px solid rgba(255,255,255,0.1);border-top-color:#22c55e;border-radius:50%;margin:0 auto 18px;animation:g .8s linear infinite;}
  @keyframes g{to{transform:rotate(360deg);}}
  a{color:#22c55e;}
  p{color:rgba(241,245,249,0.7);font-size:14px;line-height:1.6;}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h2 style="margin:0 0 8px;font-size:20px;">Ti portiamo alla cassa…</h2>
  <p>Stiamo preparando il pagamento con i dati della tua registrazione. Ci vuole un attimo.</p>
  <p id="manuale" style="display:none;">Se non succede niente, <a id="link" href="#">clicca qui</a>.</p>
</div>
<script>
/* EcoTruckConnect — 2/10/2026
   Porta alla cassa Shopify dell'iscrizione con i dati della registrazione già scritti.
   Link usato nell'email "Sei stato approvato": paga.html?e=EMAIL
   Se qualcosa non va, porta comunque alla cassa con la sola email (come prima). */
(function () {
  var CARRELLO = 'https://shop.synaimaxpro.com/cart/54395212071253:1';
  var DATI = 'https://hook.eu1.make.com/udox4qbgh6ydj1p5yps5a4q15mafv261';
  var email = (new URLSearchParams(location.search).get('e') || '').trim();
  var finito = false;

  function pulito(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }

  function linkCassa(d) {
    var p = [];
    function add(k, v) { v = pulito(v); if (v) p.push(k + '=' + encodeURIComponent(v)); }
    add('checkout[email]', (d && d.email) || email);
    if (d) {
      var rs = pulito(d.ragione_sociale) || (d.tipo === 'azienda' ? pulito(d.nome_azienda) : '');
      var persona = /individual|familiar/i.test(d.forma_giuridica || '');
      var nome = '', cognome = '';
      if (persona && (pulito(d.nome) || pulito(d.cognome))) { nome = d.nome; cognome = d.cognome; }
      else if (rs) { cognome = rs; }
      else { nome = d.nome; cognome = d.cognome; }
      ['shipping_address', 'billing_address'].forEach(function (a) {
        add('checkout[' + a + '][first_name]', nome);
        add('checkout[' + a + '][last_name]', cognome);
        if (!persona && rs) add('checkout[' + a + '][company]', rs);
        add('checkout[' + a + '][address1]', d.indirizzo);
        add('checkout[' + a + '][city]', d.citta);
        add('checkout[' + a + '][zip]', d.cap);
        add('checkout[' + a + '][province]', d.provincia);
        add('checkout[' + a + '][country]', 'IT');
      });
    }
    return CARRELLO + (p.length ? '?' + p.join('&') : '');
  }

  function vai(url) {
    if (finito) return; finito = true;
    document.getElementById('link').href = url;
    document.getElementById('manuale').style.display = 'block';
    location.replace(url);
  }

  // rete di sicurezza: dopo 8 secondi si va comunque alla cassa con la sola email
  setTimeout(function () { vai(linkCassa(null)); }, 8000);

  if (!email) { vai(linkCassa(null)); return; }
  fetch(DATI + '?e=' + encodeURIComponent(email))
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (e) {}
      vai(linkCassa(d && d.trovato ? d : null));
    })
    .catch(function () { vai(linkCassa(null)); });
})();
</script>
</body>
</html>
