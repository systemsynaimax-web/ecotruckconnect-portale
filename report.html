<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
   <script>window.ECT_SOLO_GESTORI = true;</script>
   <script src="/accesso-sicuro.js"></script>
<title>EcoTruckConnect — Report Trasportatori</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080d16;
  --surface:  #0e1623;
  --surface2: #131d2e;
  --border:   rgba(255,255,255,0.07);
  --blue:     #3b82f6;
  --green:    #22c55e;
  --amber:    #f59e0b;
  --text:     #f1f5f9;
  --muted:    rgba(241,245,249,0.45);
  --font-h:   'Syne', sans-serif;
  --font-b:   'DM Sans', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;}
h1,h2,h3{font-family:var(--font-h);}

.header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--border);background:var(--surface);}
.logo{font-family:var(--font-h);font-weight:800;font-size:22px;}
.logo span{color:var(--blue);}
.back-link{color:var(--muted);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;}
.back-link:hover{color:var(--text);}

.wrap{max-width:1000px;margin:0 auto;padding:32px;}

.page-title{font-size:26px;font-weight:800;margin-bottom:6px;}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:28px;}

.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:24px;display:flex;align-items:end;gap:16px;flex-wrap:wrap;}
.filter-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
.filter-field input, .filter-field select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font-b);font-size:14px;}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font-b);}
.btn:hover{background:#2563eb;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--blue);background:rgba(59,130,246,0.08);}
.btn-sm{padding:8px 14px;font-size:13px;}

.summary-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.summary-text{font-size:14px;color:var(--muted);}
.summary-text b{color:var(--text);}

.trasp-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;}
.trasp-top{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap;}
.trasp-name{font-size:17px;font-weight:700;font-family:var(--font-h);}
.trasp-contact{font-size:13px;color:var(--muted);margin-top:4px;}
.trasp-count{background:rgba(34,197,94,0.15);color:var(--green);font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px;white-space:nowrap;}
.trasp-tratte{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.7;}
.trasp-tratte .t-item{display:inline-block;background:var(--surface2);border-radius:6px;padding:3px 10px;margin:2px 4px 2px 0;color:var(--text);}
.trasp-actions{margin-top:14px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.ect-gira{display:inline-block;animation:ectgira .8s linear infinite;}@keyframes ectgira{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Eco<span>Truck</span>Connect</div>
  <a href="dashboard.html" class="back-link">← Torna alla Dashboard</a>
</div>

<div class="wrap">
  <div class="page-title">📋 Report Trasportatori</div>
  <div class="page-sub">Viaggi accaparrati per periodo, pronti per la fatturazione.</div>

  <div class="filter-bar">
    <div class="filter-field">
      <label>Da</label>
      <input type="date" id="data-da">
    </div>
    <div class="filter-field">
      <label>A</label>
      <input type="date" id="data-a">
    </div>
    <div class="filter-field">
      <label>Periodo rapido</label>
      <select id="periodo-rapido" onchange="periodoRapido(this.value)">
        <option value="">Personalizzato</option>
        <option value="7">Ultimi 7 giorni</option>
        <option value="15">Ultimi 15 giorni</option>
        <option value="30" selected>Ultimi 30 giorni</option>
      </select>
    </div>
    <button class="btn" onclick="applicaFiltro()">Filtra</button>
    <button class="btn btn-outline" onclick="scaricaTutti()">📥 Scarica tutti (CSV)</button>
    <button class="btn btn-outline" onclick="stampaTrasportatore(null)">🖨️ Stampa tutti</button>
    <button class="btn btn-outline" id="btn-aggiorna-rep" onclick="aggiornaRep()">🔄 Aggiorna</button>
    <input id="rep-cerca" oninput="renderLista()" placeholder="🔎 Cerca trasportatore, azienda, città…" style="flex:1;min-width:200px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:9px 12px;color:#f1f5f9;font-size:13px;">
  </div>

  <div class="summary-bar">
    <div class="summary-text" id="summary-text">Caricamento…</div>
  </div>

  <div id="lista-trasportatori"></div>
</div>

<script>
const PROXY_WEBHOOK = 'https://hook.eu1.make.com/n78xlbwx6483qv9v0eamw5th3sq20qak';
let tuttiCarichi = [];
let carichiFiltrati = [];

function fmtData(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('it-IT');
}
function inputDate(d) {
  return d.toISOString().slice(0,10);
}

function periodoRapido(giorni) {
  if (!giorni) return;
  const oggi = new Date();
  const da = new Date();
  da.setDate(oggi.getDate() - parseInt(giorni));
  document.getElementById('data-da').value = inputDate(da);
  document.getElementById('data-a').value = inputDate(oggi);
  applicaFiltro();
}

async function carica() {
  try {
    const res = await fetch(PROXY_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get_dashboard_data' })
    });
    const data = await res.json();
    const raw = data.carichi || [];
    tuttiCarichi = raw.map(r => ({ id: r.id, fields: r.fields || r }))
      .filter(c => (c.fields.stato||'').toUpperCase() === 'PRESO' && c.fields.data_assegnato);
    periodoRapido(30);
  } catch (e) {
    document.getElementById('summary-text').textContent = '⚠️ Errore di connessione.';
    console.error(e);
  }
}

function applicaFiltro() {
  const da = document.getElementById('data-da').value;
  const a = document.getElementById('data-a').value;
  if (!da || !a) return;
  const daDate = new Date(da + 'T00:00:00');
  const aDate = new Date(a + 'T23:59:59');
  carichiFiltrati = tuttiCarichi.filter(c => {
    const d = new Date(c.fields.data_assegnato);
    return d >= daDate && d <= aDate;
  });
  renderLista();
}

function renderLista() {
  const gruppi = {};
  const q = ((document.getElementById('rep-cerca') || {}).value || '').trim().toLowerCase();
  carichiFiltrati.forEach(c => {
    const f = c.fields;
    if (q && ![f.assegnato_a_nome, f.bloccato_da_nome, f.bloccato_da_id, f.nome_azienda, f.citta_partenza, f.citta_arrivo, f.numero_ordine].join(' ').toLowerCase().includes(q)) return;
    const key = f.bloccato_da_id || f.assegnato_a_nome || 'sconosciuto';
    if (!gruppi[key]) gruppi[key] = { nome: f.assegnato_a_nome || f.bloccato_da_nome || 'Nome non disponibile', telefono: f.assegnato_a_telefono || '—', email: f.bloccato_da_id || '—', carichi: [] };
    gruppi[key].carichi.push(f);
  });

  const nomiTrasportatori = Object.keys(gruppi).length;
  document.getElementById('summary-text').innerHTML = `<b>${Object.values(gruppi).reduce((n, g) => n + g.carichi.length, 0)}</b> viaggi accaparrati da <b>${nomiTrasportatori}</b> trasportatori nel periodo selezionato.`;

  const el = document.getElementById('lista-trasportatori');
  if (!nomiTrasportatori) {
    el.innerHTML = '<div class="empty-state">Nessun viaggio accaparrato in questo periodo.</div>';
    return;
  }

  el.innerHTML = Object.entries(gruppi).map(([key, g]) => {
    const tratte = g.carichi.map(c => `<span class="t-item">${fmtData(c.data_assegnato)} ${c.data_assegnato ? new Date(c.data_assegnato).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : ''} · ${c.citta_partenza}→${c.citta_arrivo}</span>`).join('');
    return `<div class="trasp-card">
      <div class="trasp-top">
        <div>
          <div class="trasp-name">👤 ${g.nome}</div>
          <div class="trasp-contact">📞 ${g.telefono} &nbsp; ✉️ ${g.email}</div>
        </div>
        <div class="trasp-count">${g.carichi.length} viagg${g.carichi.length===1?'io':'i'}</div>
      </div>
      <div class="trasp-tratte">${tratte}</div>
      <div class="trasp-actions">
        <button class="btn btn-sm" onclick='scaricaTrasportatore(${JSON.stringify(key)})'>📥 Scarica report di ${g.nome}</button>
        <button class="btn btn-sm" onclick='stampaTrasportatore(${JSON.stringify(key)})'>🖨️ Stampa</button>
      </div>
    </div>`;
  }).join('');
}

function escR(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function euroRep(v) { const n = parseFloat(String(v || '0').replace(/[^\d,.-]/g, '').replace(',', '.')) || 0; return '€ ' + n.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
async function aggiornaRep() {
  const b = document.getElementById('btn-aggiorna-rep');
  b.disabled = true; b.innerHTML = '<span class="ect-gira">🔄</span> Aggiorno…';
  const da = document.getElementById('data-da').value, a = document.getElementById('data-a').value;
  await carica();
  if (da && a) { document.getElementById('data-da').value = da; document.getElementById('data-a').value = a; applicaFiltro(); }
  b.innerHTML = '✅ Aggiornato'; setTimeout(() => { b.disabled = false; b.innerHTML = '🔄 Aggiorna'; }, 1400);
}
/* 28/9 — Foglio stampabile di UN trasportatore (o di tutti) nel periodo scelto: per fatture e contestazioni */
function stampaTrasportatore(key) {
  const carichi = carichiFiltrati.filter(c => key === null || (c.fields.bloccato_da_id || c.fields.assegnato_a_nome) === key)
    .sort((x, y) => new Date(x.fields.data_assegnato) - new Date(y.fields.data_assegnato));
  if (!carichi.length) { alert('Nessun viaggio da stampare in questo periodo.'); return; }
  const f0 = carichi[0].fields;
  const titolo = key === null ? 'Report di tutti i trasportatori' : 'Report di ' + (f0.assegnato_a_nome || f0.bloccato_da_nome || 'trasportatore');
  const da = document.getElementById('data-da').value, a = document.getElementById('data-a').value;
  const periodo = (da ? new Date(da + 'T00:00:00').toLocaleDateString('it-IT') : '') + ' – ' + (a ? new Date(a + 'T00:00:00').toLocaleDateString('it-IT') : '');
  const intest = key === null ? '' : `<table style="margin-bottom:14px;"><tr><th>Trasportatore</th><td>${escR(f0.assegnato_a_nome || f0.bloccato_da_nome || '—')}</td></tr><tr><th>Email</th><td>${escR(f0.bloccato_da_id || '—')}</td></tr><tr><th>Telefono</th><td>${escR(f0.assegnato_a_telefono || '—')}</td></tr></table>`;
  let totTrasp = 0;
  const righe = carichi.map(c => {
    const f = c.fields; const imp = parseFloat(String(f.importo_pattuito || '0').replace(',', '.')) || 0; totTrasp += imp;
    return `<tr><td>${escR(new Date(f.data_assegnato).toLocaleString('it-IT', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</td>` +
      (key === null ? `<td>${escR(f.assegnato_a_nome || f.bloccato_da_nome || f.bloccato_da_id || '—')}</td>` : '') +
      `<td>${escR(f.numero_ordine || '')}</td><td>${escR((f.citta_partenza || '—') + ' → ' + (f.citta_arrivo || '—'))}<br><small>CAP ${escR(f.cap_partenza || '—')} → ${escR(f.cap_arrivo || '—')} · carico del ${escR(fmtData(f.data_consegna))}</small></td>` +
      `<td>${escR(f.nome_azienda || '—')}<br><small>${escR(f.email_azienda || '')} ${escR(f.telefono_azienda || '')}</small></td><td>${escR(f.tipo_merce || '—')}${f.specifica ? '<br><small>' + escR(f.specifica) + '</small>' : ''}</td>` +
      `<td>${escR(f.importo_pattuito ? euroRep(f.importo_pattuito) : '—')}<br><small>${escR(f.termini_pagamento || '')}</small></td><td>${escR(euroRep(20))}</td></tr>`;
  }).join('');
  const html = intest + `<table><tr><th>Preso il</th>${key === null ? '<th>Trasportatore</th>' : ''}<th>Ordine</th><th>Tratta</th><th>Azienda</th><th>Merce</th><th>Prezzo trasporto</th><th>Commissione</th></tr>${righe}
    <tr><th colspan="${key === null ? 6 : 5}" style="text-align:right">Totali (${carichi.length} viagg${carichi.length === 1 ? 'io' : 'i'})</th><td><b>${escR(euroRep(totTrasp))}</b></td><td><b>${escR(euroRep(20 * carichi.length))}</b></td></tr></table>`;
  const w = window.open('', '_blank');
  if (!w) { alert('Il browser ha bloccato la finestra di stampa: consenti i popup per questo sito.'); return; }
  w.document.write(`<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>${escR(titolo)}</title><style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:26px;font-size:12px;} h1{font-size:18px;margin:0 0 4px;} .sub{color:#555;margin-bottom:16px;}
    table{width:100%;border-collapse:collapse;} td,th{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top;} th{background:#f1f5f9;} small{color:#555;}
    .barra{margin-bottom:14px;} .barra button{padding:9px 16px;font-weight:700;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;}
    @media print{.barra{display:none;}}</style></head><body>
    <div class="barra"><button onclick="window.print()">🖨️ Stampa / 📄 Salva PDF</button></div>
    <h1>${escR(titolo)}</h1><div class="sub">Periodo: ${escR(periodo)} · EcoTruckConnect — SynAIMAX S.R.L.S. · stampato il ${new Date().toLocaleString('it-IT')}</div>${html}
    <p style="font-size:11px;color:#666;margin-top:14px;">Il prezzo del trasporto è pattuito tra azienda e trasportatore: SynAIMAX non è parte del contratto di trasporto. La commissione è l'importo pagato dal trasportatore a SynAIMAX per accaparrare il carico.</p></body></html>`);
  w.document.close();
}

function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v).replace(/"/g, '""');
  return /[",\n]/.test(s) ? `"${s}"` : s;
}

function generaCSV(righe, intestazioni) {
  const header = intestazioni.map(csvEscape).join(',');
  const body = righe.map(r => r.map(csvEscape).join(',')).join('\n');
  return header + '\n' + body;
}

function scaricaFile(contenuto, nomeFile) {
  const blob = new Blob(['\uFEFF' + contenuto], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomeFile;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function scaricaTrasportatore(key) {
  const carichi = carichiFiltrati.filter(c => (c.fields.bloccato_da_id || c.fields.assegnato_a_nome) === key);
  if (!carichi.length) return;
  const nome = carichi[0].fields.assegnato_a_nome || 'trasportatore';
  const righe = carichi.map(c => {
    const f = c.fields;
    return [fmtData(f.data_assegnato), `${f.citta_partenza} → ${f.citta_arrivo}`, f.nome_azienda||'', f.numero_ordine||'', f.tipo_merce||''];
  });
  const csv = generaCSV(righe, ['Data', 'Tratta', 'Azienda', 'Numero Ordine', 'Merce']);
  scaricaFile(csv, `report_${nome.replace(/\s+/g,'')}_${document.getElementById('data-da').value}_${document.getElementById('data-a').value}.csv`);
}

function scaricaTutti() {
  if (!carichiFiltrati.length) return;
  const righe = carichiFiltrati.map(c => {
    const f = c.fields;
    return [fmtData(f.data_assegnato), f.assegnato_a_nome||'', f.assegnato_a_telefono||'', f.bloccato_da_id||'', `${f.citta_partenza} → ${f.citta_arrivo}`, f.nome_azienda||'', f.numero_ordine||'', f.tipo_merce||''];
  });
  const csv = generaCSV(righe, ['Data', 'Trasportatore', 'Telefono', 'Email', 'Tratta', 'Azienda', 'Numero Ordine', 'Merce']);
  scaricaFile(csv, `report_completo_${document.getElementById('data-da').value}_${document.getElementById('data-a').value}.csv`);
}

carica();
</script>
</body>
</html>
